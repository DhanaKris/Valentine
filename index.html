<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", sans-serif;
      height: 100vh;
      background: linear-gradient(270deg, #ff4d6d, #ff9a9e, #fad0c4, #ffb703);
      background-size: 800% 800%;
      animation: gradientMove 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255,255,255,0.92);
      padding: 40px 50px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      position: relative;
      z-index: 10;
      width: 420px;
      height: 280px;
    }

    h1 {
      font-size: 34px;
      margin-bottom: 30px;
      color: #ff2e63;
    }

    .buttons { position: relative; height: 100px; }

    button {
      font-size: 20px;
      padding: 12px 30px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
      position: absolute;
      z-index: 10;
    }

    #yesBtn {
      background: linear-gradient(45deg, #ff2e63, #ff6f91);
      color: white;
      left: 50px;
      box-shadow: 0 6px 15px rgba(255,46,99,0.5);
    }

    #yesBtn:hover { transform: scale(1.1); }

    #noBtn {
      background: #adb5bd;
      color: white;
      left: 230px;
      top: 0;
    }

    .celebration {
      display: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #fff0f3, #ff4d6d);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      z-index: 15;
      overflow: hidden;
    }

    .celebration h1 {
      font-size: 50px;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 15px;
    }

    .celebration p {
      font-size: 26px;
      color: white;
      margin-bottom: 40px;
    }

    .rose, .bigHeart {
      position: absolute;
      user-select: none;
      pointer-events: none;
    }

    .rose {
      font-size: 32px;
      animation: fall 6s linear infinite;
    }

    .bigHeart {
      font-size: 28px;
      animation: fall 5s linear infinite;
    }

    @keyframes fall {
      from { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="card" id="mainCard">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons" id="buttonArea">
      <button id="yesBtn" onclick="yesClicked()">YES 💘</button>
      <button id="noBtn">NO 🙃</button>
    </div>
  </div>

  <div class="celebration" id="celebration">
    <h1>YAYYYY!!! 💕🥰</h1>
    <p>You just made my heart the happiest 💖</p>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const mainCard = document.getElementById("mainCard");
    const celebration = document.getElementById("celebration");

    // NO button moves based on mouse position
    document.addEventListener("mousemove", (e) => {
      const rect = noBtn.getBoundingClientRect();
      const mouseX = e.clientX;
      const mouseY = e.clientY;
      const btnX = rect.left + rect.width / 2;
      const btnY = rect.top + rect.height / 2;

      const distance = Math.hypot(mouseX - btnX, mouseY - btnY);

      if (distance < 150) { // closer = move
        const offsetX = (btnX - mouseX) / distance * 100;
        const offsetY = (btnY - mouseY) / distance * 100;

        let newX = rect.left + offsetX;
        let newY = rect.top + offsetY;

        // keep button fully inside viewport
        newX = Math.min(Math.max(0, newX), window.innerWidth - rect.width);
        newY = Math.min(Math.max(0, newY), window.innerHeight - rect.height);

        noBtn.style.left = newX + "px";
        noBtn.style.top = newY + "px";
      }
    });

    // YES clicked
    function yesClicked() {
      mainCard.style.display = "none";
      celebration.style.display = "flex";
      startRoses();
      startHeartRain();
    }

    function startRoses() {
      setInterval(() => {
        const rose = document.createElement("div");
        rose.className = "rose";
        rose.innerHTML = "🌹";
        rose.style.left = Math.random() * 100 + "vw";
        rose.style.animationDuration = Math.random() * 3 + 4 + "s";
        celebration.appendChild(rose);
        setTimeout(() => rose.remove(), 7000);
      }, 200);
    }

    function startHeartRain() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "bigHeart";
        heart.innerHTML = "💗";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 25 + 25 + "px";
        heart.style.animationDuration = Math.random() * 2 + 3 + "s";
        celebration.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }, 150);
    }
  </script>
</body>
</html>
