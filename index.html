<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(270deg, #ff4d6d, #ff9a9e, #fad0c4, #ffb703);
      background-size: 800% 800%;
      animation: gradientMove 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Main card */
    .card {
      background: rgba(255, 255, 255, 0.92);
      padding: 40px 50px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      position: relative;
      z-index: 10;
      width: 380px;
      height: 260px;
    }

    h1 {
      font-size: 32px;
      margin-bottom: 25px;
      color: #ff2e63;
    }

    .buttons {
      margin-top: 20px;
      position: relative;
      height: 100px;
    }

    button {
      font-size: 20px;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
      position: absolute;
    }

    #yesBtn {
      background: linear-gradient(45deg, #ff2e63, #ff6f91);
      color: white;
      left: 40px;
      box-shadow: 0 6px 15px rgba(255,46,99,0.5);
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background: #adb5bd;
      color: white;
      left: 100px;
      top: 0;
      z-index: 999;
    }

    /* Floating hearts on main screen */
    .heart {
      position: absolute;
      color: rgba(255,255,255,0.85);
      font-size: 20px;
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh) scale(1); opacity: 1; }
      to { transform: translateY(-10vh) scale(1.6); opacity: 0; }
    }

    /* Celebration screen */
    .celebration {
      display: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, #fff0f3, #ff4d6d);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: popIn 0.8s ease forwards;
      text-align: center;
      z-index: 20;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .celebration h1 {
      font-size: 48px;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 15px;
    }

    .celebration p {
      font-size: 24px;
      color: white;
      margin-bottom: 40px;
    }

    /* Falling roses */
    .rose {
      position: absolute;
      font-size: 32px;
      animation: fall 6s linear infinite;
      user-select: none;
      pointer-events: none;
    }

    /* Heavy hearts rain */
    .bigHeart {
      position: absolute;
      font-size: 28px;
      animation: fall 5s linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes fall {
      from { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      animation: confettiFall 3s linear infinite;
      pointer-events: none;
    }

    @keyframes confettiFall {
      from { transform: translateY(-10vh) rotate(0deg); }
      to { transform: translateY(110vh) rotate(720deg); }
    }
  </style>
</head>
<body>

  <!-- Main Question Card -->
  <div class="card" id="mainCard">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">YES 💘</button>
      <button id="noBtn" onmouseenter="moveNo()">NO 🙃</button>
    </div>
  </div>

  <!-- Celebration Screen -->
  <div class="celebration" id="celebration">
    <h1>YAYYYY!!! 💕🥰</h1>
    <p>You just made my heart the happiest 💖</p>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const celebration = document.getElementById("celebration");
    const mainCard = document.getElementById("mainCard");

    /* Move NO button anywhere on screen but keep it visible */
    function moveNo() {
      const btnRect = noBtn.getBoundingClientRect();
      const maxX = window.innerWidth - btnRect.width - 20;
      const maxY = window.innerHeight - btnRect.height - 20;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.position = "fixed";
    }

    /* YES clicked */
    function yesClicked() {
      mainCard.style.display = "none";
      noBtn.style.display = "none";
      celebration.style.display = "flex";
      startConfetti();
      startRoses();
      startHeartRain();
    }

    /* Floating hearts on main screen */
    function createHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 18 + "px";
      heart.style.animationDuration = Math.random() * 3 + 4 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 7000);
    }
    setInterval(createHeart, 500);

    /* Confetti generator */
    function startConfetti() {
      setInterval(() => {
        const confetti = document.createElement("div");
        confetti.className = "confetti";
        confetti.style.left = Math.random() * 100 + "vw";
        confetti.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        confetti.style.animationDuration = Math.random() * 2 + 2 + "s";
        document.body.appendChild(confetti);
        setTimeout(() => confetti.remove(), 4000);
      }, 100);
    }

    /* Falling roses */
    function startRoses() {
      setInterval(() => {
        const rose = document.createElement("div");
        rose.className = "rose";
        rose.innerHTML = "🌹";
        rose.style.left = Math.random() * 100 + "vw";
        rose.style.animationDuration = Math.random() * 3 + 4 + "s";
        document.body.appendChild(rose);
        setTimeout(() => rose.remove(), 7000);
      }, 200);
    }

    /* Heavy hearts rain */
    function startHeartRain() {
      setInterval(() => {
        const heart = document.createElement("div");
        heart.className = "bigHeart";
        heart.innerHTML = "💗";
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = Math.random() * 25 + 25 + "px";
        heart.style.animationDuration = Math.random() * 2 + 3 + "s";
        document.body.appendChild(heart);
        setTimeout(() => heart.remove(), 7000);
      }, 150);
    }
  </script>

</body>
</html>
