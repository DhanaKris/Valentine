<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💘</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(270deg, #ff4d6d, #ff9a9e, #fad0c4, #ffb703);
      background-size: 800% 800%;
      animation: gradientMove 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .card {
      background: rgba(255,255,255,0.9);
      padding: 40px 50px;
      border-radius: 25px;
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 25px;
      color: #ff2e63;
    }

    .buttons {
      margin-top: 20px;
      position: relative;
      height: 80px;
    }

    button {
      font-size: 20px;
      padding: 12px 28px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
      transition: transform 0.2s;
      position: absolute;
    }

    #yesBtn {
      background: linear-gradient(45deg, #ff2e63, #ff6f91);
      color: white;
      left: 20%;
      box-shadow: 0 6px 15px rgba(255,46,99,0.5);
    }

    #yesBtn:hover {
      transform: scale(1.1);
    }

    #noBtn {
      background: #adb5bd;
      color: white;
      left: 55%;
    }

    /* Floating hearts */
    .heart {
      position: absolute;
      color: rgba(255,255,255,0.8);
      font-size: 20px;
      animation: floatUp linear infinite;
      user-select: none;
    }

    @keyframes floatUp {
      from { transform: translateY(100vh) scale(1); opacity: 1; }
      to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* Celebration page */
    .celebration {
      display: none;
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at top, #fff0f3, #ff4d6d);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      animation: popIn 0.8s ease forwards;
    }

    @keyframes popIn {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .celebration h1 {
      font-size: 48px;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 20px;
    }

    .celebration p {
      font-size: 24px;
      color: white;
      margin-bottom: 40px;
    }

    /* Flowers */
    .flower {
      position: absolute;
      font-size: 32px;
      animation: fall 6s linear infinite;
      user-select: none;
    }

    @keyframes fall {
      from { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Confetti */
    .confetti {
      position: absolute;
      width: 10px;
      height: 10px;
      background: red;
      animation: confettiFall 3s linear infinite;
    }
