<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      position: relative;
    }

    .container {
      text-align: center;
      background: white;
      padding: 40px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    h1 {
      margin-bottom: 30px;
      color: #ff4d6d;
    }

    button {
      font-size: 18px;
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
      position: relative;
    }

    #yesBtn {
      background: #ff4d6d;
      color: white;
    }

    /* NO button starts next to YES */
    #noBtn {
      background: #999;
      color: white;
      position: absolute;
      z-index: 10;
    }

    #landing {
      display: none;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ff9a9e, #ffdde1);
      overflow: hidden;
      position: relative;
    }

    #landing h1 {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ff1e56;
      font-size: 50px;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.2);
    }

    .falling {
      position: absolute;
      top: -50px;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      animation-name: fall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(360deg); opacity: 0.7; }
    }
  </style>
</head>
<body>

  <!-- MAIN PAGE -->
  <div class="container" id="mainPage">
    <h1>Dear Nima, Will you be my Valentine forever? 💘</h1>
    <button id="yesBtn" onclick="yesClicked()">YES 💖</button>
  </div>

  <!-- NO BUTTON MOVING -->
  <button id="noBtn" onmouseover="moveNo()">NO 🙃</button>

  <!-- LANDING PAGE -->
  <div id="landing">
    <h1>Yay! 💕 Thank you for being part of my life and making it magical 💖🌹</h1>
  </div>

  <script>
    // PLACE NO NEXT TO YES INITIALLY
    window.onload = function() {
      const yesBtn = document.getElementById("yesBtn");
      const noBtn = document.getElementById("noBtn");

      // Get YES button position
      const rect = yesBtn.getBoundingClientRect();

      // Place NO 20px to the right
      noBtn.style.left = rect.right + 20 + "px";
      noBtn.style.top = rect.top + "px";
    }

    // MOVE NO BUTTON WITHOUT DISAPPEARING
    function moveNo() {
      const noBtn = document.getElementById("noBtn");
      const btnWidth = noBtn.offsetWidth;
      const btnHeight = noBtn.offsetHeight;

      // Keep button inside viewport
      const maxX = window.innerWidth - btnWidth - 10;
      const maxY = window.innerHeight - btnHeight - 10;

      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
    }

    // YES BUTTON CLICK -> SHOW LANDING PAGE
    function yesClicked() {
      document.getElementById("mainPage").style.display = "none";
      document.getElementById("noBtn").style.display = "none"; // hide NO button
      const landing = document.getElementById("landing");
      landing.style.display = "block";

      createFallingItems();
    }

    // FALLING HEARTS & ROSES
    function createFallingItems() {
      const symbols = ["💖","❤️","🌹"];
      const landing = document.getElementById("landing");

      setInterval(() => {
        const span = document.createElement("span");
        span.classList.add("falling");
        span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * window.innerWidth + "px";
        span.style.fontSize = 20 + Math.random() * 30 + "px";
        span.style.animationDuration = 3 + Math.random() * 5 + "s";
        landing.appendChild(span);

        setTimeout(() => {
          landing.removeChild(span);
        }, 8000);
      }, 300);
    }
  </script>

</body>
</html>
