<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Be My Valentine 💖</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      font-family: "Segoe UI", sans-serif;
      background: linear-gradient(270deg, #ff4d6d, #ff9a9e, #fad0c4, #ffb703);
      background-size: 800% 800%;
      animation: gradientMove 10s ease infinite;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Bigger Prompt Card */
    .card {
      background: rgba(255, 255, 255, 0.95);
      padding: 70px 80px;
      border-radius: 36px;
      text-align: center;
      box-shadow: 0 20px 55px rgba(0,0,0,0.3);
      position: relative;
      z-index: 10;
      width: 640px;
      height: 380px;
    }

    h1 {
      font-size: 44px;
      margin-bottom: 45px;
      color: #ff2e63;
    }

    .buttons {
      position: relative;
      height: 100px;
      width: 100%;
    }

    button {
      font-size: 24px;
      padding: 16px 40px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s;
      position: absolute;
      top: 0;
    }

    #yesBtn {
      background: linear-gradient(45deg, #ff2e63, #ff6f91);
      color: white;
      left: 140px;
      box-shadow: 0 6px 15px rgba(255,46,99,0.5);
    }

    #yesBtn:hover { transform: scale(1.1); }

    #noBtn {
      background: #adb5bd;
      color: white;
      left: 360px;
      z-index: 999;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      color: rgba(255,255,255,0.9);
      animation: floatUp linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes floatUp {
      from { transform: translateY(110vh) scale(1); opacity: 1; }
      to { transform: translateY(-10vh) scale(1.5); opacity: 0; }
    }

    /* Celebration screen */
    .celebration {
      display: none;
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at top, #fff0f3, #ff4d6d);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      text-align: center;
      z-index: 20;
    }

    .celebration h1 {
      font-size: 56px;
      color: #fff;
      text-shadow: 0 4px 15px rgba(0,0,0,0.3);
      margin-bottom: 10px;
    }

    .celebration p {
      font-size: 28px;
      color: white;
      margin-bottom: 30px;
    }

    /* Falling roses */
    .rose {
      position: fixed;
      font-size: 36px;
      animation: fall linear infinite;
      user-select: none;
      pointer-events: none;
    }

    /* Falling hearts celebration */
    .bigHeart {
      position: fixed;
      font-size: 32px;
      animation: fall linear infinite;
      user-select: none;
      pointer-events: none;
    }

    @keyframes fall {
      from { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      to { transform: translateY(110vh) rotate(360deg); opacity: 0; }
    }

    /* Confetti */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      animation: confettiFall linear infinite;
      pointer-events: none;
    }

    @keyframes confettiFall {
      from { transform: translateY(-10vh) rotate(0deg); }
      to { transform: translateY(110vh) rotate(720deg); }
    }
  </style>
</head>
<body>

  <!-- Prompt Screen -->
  <div class="card" id="mainCard">
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yesBtn" onclick="yesClicked()">YES 💘</button>
      <button id="noBtn" onmouseenter="moveNo()">NO 🙃</button>
    </div>
  </div>

  <!-- Celebration Screen -->
  <div class="celebration" id="celebration">
    <h1>YAYYYY!!! 💕🥰</h1>
    <p>You just made my heart the happiest 💖</p>
  </div>

  <script>
    const noBtn = document.getElementById("noBtn");
    const celebration = document.getElementById("celebration");
    const mainCard = document.getElementById("mainCard");

    /* Move NO button anywhere but keep visible */
    function moveNo() {
      const rect = noBtn.getBoundingClientRect();
      const maxX = window.innerWidth - rect.width - 20;
      const maxY = window.innerHeight - rect.height - 20;
      noBtn.style.position = "fixed";
      noBtn.style.left = Math.random() * maxX + "px";
      noBtn.style.top = Math.random() * maxY + "px";
    }

    /* Background floating hearts forever */
    function spawnBackgroundHeart() {
      const heart = document.createElement("div");
      heart.className = "heart";
      heart.innerHTML = "💖";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 22 + 18 + "px";
      heart.style.animationDuration = Math.random() * 4 + 5 + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 9000);
    }
    setInterval(spawnBackgroundHeart, 300);

    /* YES clicked */
    function yesClicked() {
      mainCard.style.display = "none";
      noBtn.style.display = "none";
      celebration.style.display = "flex";
      startConfetti();
      startRoses();
      startHeartRain();
    }

    /* Infinite confetti */
    function startConfetti() {
      setInterval(() => {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random() * 360}, 100%, 50%)`;
        c.style.animationDuration = Math.random() * 2 + 2 + "s";
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 4000);
      }, 70);
    }

    /* Infinite roses */
    function startRoses() {
      setInterval(() => {
        const r = document.createElement("div");
        r.className = "rose";
        r.innerHTML = "🌹";
        r.style.left = Math.random() * 100 + "vw";
        r.style.animationDuration = Math.random() * 3 + 4 + "s";
        document.body.appendChild(r);
        setTimeout(() => r.remove(), 7000);
      }, 120);
    }

    /* Infinite heart rain */
    function startHeartRain() {
      setInterval(() => {
        const h = document.createElement("div");
        h.className = "bigHeart";
        h.innerHTML = "💗";
        h.style.left = Math.random() * 100 + "vw";
        h.style.fontSize = Math.random() * 30 + 22 + "px";
        h.style.animationDuration = Math.random() * 2 + 3 + "s";
        document.body.appendChild(h);
        setTimeout(() => h.remove(), 7000);
      }, 90);
    }
  </script>

</body>
</html>
